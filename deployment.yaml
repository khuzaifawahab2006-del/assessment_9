apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: university-portal
  template:
    metadata:
      labels:
        app: university-portal
    spec:
      containers:
      - name: university-portal
        image: DOCKERHUB_USERNAME/university-portal:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # Health checks configured for monitoring platform stability
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: university-portal-service
spec:
  type: NodePort
  selector:
    app: university-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010

